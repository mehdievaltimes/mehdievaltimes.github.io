# Scratch workflow for steering experiments (steer/). Runs only on this branch's pushes
# that touch steer/, never on main.
name: Steer lab

on:
  push:
    branches: [ai/vigilant-cannon-3b22tz]
    paths: ['steer/**', '.github/workflows/steer-lab.yml']

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q onnx onnxruntime numpy tokenizers huggingface_hub
      - name: Lab
        run: |
          set -a; . steer/lab.env; set +a
          python -u "steer/$SCRIPT.py" onnx-community/Qwen2.5-0.5B-Instruct onnx/model_q4f16.onnx "$LAYERS"
