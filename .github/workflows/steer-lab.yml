# Scratch workflow for building the Roaree steering demo. Runs only on this branch's pushes
# that touch steer/ or the page's core, never on main.
name: Steer lab

on:
  push:
    branches: [ai/vigilant-cannon-3b22tz]
    paths: ['steer/**', 'public/js/roaree-core.js', '.github/workflows/steer-lab.yml']

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pip install -q onnx onnxruntime numpy tokenizers huggingface_hub
      - name: Lab
        env:
          EXPORT_LAYER: '10'
          EXPORT_MIX: '1.0'
          MAX: '0.7'
          DEFAULT: '0.7'
          COEFS: '0.4,0.5,0.6'
          MIXES: '0.5,1.0,1.5'
        run: python -u steer/lab.py onnx-community/Qwen2.5-0.5B-Instruct onnx/model_q4f16.onnx 8,10
      - name: The page's own code against the real model
        run: |
          npm i --no-save --silent onnxruntime-node@1.30.0 @huggingface/tokenizers@0.2.0
          node steer/node-test.mjs steer/out/steer.json
