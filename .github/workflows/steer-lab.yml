# Scratch workflow for building the Roaree steering demo. Runs only on this branch's pushes
# that touch steer/ or the page's core, never on main.
name: Steer lab

on:
  push:
    branches: [ai/vigilant-cannon-3b22tz]
    paths: ['steer/**', 'public/js/roaree*.js', 'src/pages/roaree.astro', '.github/workflows/steer-lab.yml']

permissions:
  contents: write  # to commit the tested steer.json back to this branch

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pip install -q onnx onnxruntime numpy tokenizers huggingface_hub
      - name: Lab
        env:
          EXPORT_LAYER: '10'
          EXPORT_MIX: '0'
          MAX: '0.7'
          DEFAULT: '0.65'
          COEFS: '0.4,0.45,0.5'
          MIXES: '0'
        run: python -u steer/lab.py onnx-community/Qwen2.5-0.5B-Instruct onnx/model_q4f16.onnx 10
      - name: The page's own code against the real model
        run: |
          npm i --no-save --silent onnxruntime-node@1.30.0 @huggingface/tokenizers@0.2.0
          node steer/node-test.mjs steer/out/steer.json
      - name: Build the site with this steer.json
        run: |
          mkdir -p public/roaree && cp steer/out/steer.json public/roaree/steer.json
          npm ci --silent && npm run build
      - name: The page itself in a browser
        run: |
          npx playwright install --with-deps chromium > /dev/null
          npx astro preview --port 4321 > /dev/null 2>&1 &
          sleep 5
          node steer/browser-test.mjs http://localhost:4321
      - name: Commit the steer.json that just passed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f public/roaree/steer.json
          # No [skip ci]: a push made with GITHUB_TOKEN never triggers workflows anyway, and the tag
          # would survive a squash merge into main and skip the site deploy.
          git diff --cached --quiet || { git commit -m "roaree: steer.json from steer lab run ${{ github.run_id }}" && git push; }
