# Scratch workflow for building the /sae steering demo. Runs only on this branch's pushes
# that touch steer/ or the page's core, never on main.
name: Steer lab

on:
  push:
    branches: [ai/vigilant-cannon-3b22tz]
    paths: ['steer/**', 'public/js/sae*.js', 'src/pages/sae.astro', '.github/workflows/steer-lab.yml']

permissions:
  contents: write  # to commit the tested steer.json back to this branch

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pip install -q onnx onnxruntime numpy tokenizers huggingface_hub
      - name: Lab
        id: lab
        run: |
          set -a; . steer/lab.env; set +a
          python -u "steer/$SCRIPT.py" onnx-community/Qwen2.5-0.5B-Instruct onnx/model_q4f16.onnx "$LAYERS"
          echo "export=${EXPORT_LAYER:+yes}" >> "$GITHUB_OUTPUT"
      - name: The page's own code against the real model
        if: steps.lab.outputs.export == 'yes'
        run: |
          npm i --no-save --silent onnxruntime-node@1.30.0 @huggingface/tokenizers@0.2.0
          node steer/node-test.mjs steer/out/steer.json
      - name: Build the site with this steer.json
        if: steps.lab.outputs.export == 'yes'
        run: |
          mkdir -p public/sae && cp steer/out/steer.json public/sae/steer.json
          npm ci --silent && npm run build
      - name: The page itself in a browser
        if: steps.lab.outputs.export == 'yes'
        run: |
          npx playwright install --with-deps chromium > /dev/null
          npx astro preview --port 4321 > /dev/null 2>&1 &
          sleep 5
          node steer/browser-test.mjs http://localhost:4321
      - name: Commit the steer.json that just passed
        if: steps.lab.outputs.export == 'yes'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f public/sae/steer.json
          # No [skip ci]: a push made with GITHUB_TOKEN never triggers workflows anyway, and the tag
          # would survive a squash merge into main and skip the site deploy.
          git diff --cached --quiet || { git commit -m "sae: steer.json from steer lab run ${{ github.run_id }}" && git push; }

  # The site as it is deployed right now, in a real browser.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true  # the live site lags this branch until it merges
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --silent && npx playwright install --with-deps chromium > /dev/null
      - name: The live page in a browser
        run: node steer/browser-test.mjs https://mehdievaltimes.github.io
